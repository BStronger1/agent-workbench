name: Verify workbench
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            qa/package-lock.json
      - run: npm ci --prefix web && npm run build --prefix web
      - run: mkdir -p src/main/resources/static && cp -R web/dist/. src/main/resources/static/
      - run: mvn -B -gs settings.xml -s settings.xml package
      - run: npm ci --prefix qa && cd qa && npx playwright install --with-deps chromium
      - name: End-to-end browser verification
        run: |
          export QA_COMMAND="[\"node\",\"$GITHUB_WORKSPACE/qa/worker.mjs\"]"
          java -jar target/agent-workbench-0.1.0.jar > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8123/api/workbench/config && break; sleep 1; done
          cd qa && node --test eval-policy.test.mjs contract.test.mjs contract-whitespace.test.mjs && node smoke.mjs && node provider-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            qa/test-results/
            target/surefire-reports/
            server.log

  ai:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: workbench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      VECTOR_DSN: postgresql://workbench:ci-test-only@127.0.0.1:5432/workbench
      RUN_EMBEDDING_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai_service/requirements.lock
      - run: pip install -r ai_service/requirements.lock
      - run: python -m pytest ai_service/tests -q --junitxml=ai-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-verification
          path: ai-tests.xml
