<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验准备清单</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fa;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .item:last-child {
            border-bottom: none;
        }
        .item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
        }
        .item label {
            font-size: 16px;
            color: #333;
            cursor: pointer;
        }
        .actions {
            margin-top: 20px;
            text-align: center;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2980b9;
        }
        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #27ae60;
            min-height: 28px;
        }
    </style>
</head>
<body>
    <h1>实验准备清单</h1>
    <div class="container">
        <div class="item">
            <input type="checkbox" id="item1" data-testid="selection-item">
            <label for="item1">试管与烧杯</label>
        </div>
        <div class="item">
            <input type="checkbox" id="item2" data-testid="selection-item">
            <label for="item2">显微镜</label>
        </div>
        <div class="item">
            <input type="checkbox" id="item3" data-testid="selection-item">
            <label for="item3">实验记录本</label>
        </div>
        <div class="item">
            <input type="checkbox" id="item4" data-testid="selection-item">
            <label for="item4">防护手套</label>
        </div>
        <div class="actions">
            <button data-testid="primary-action" onclick="updateProgress()">更新进度</button>
        </div>
        <div class="result" data-testid="result" id="resultDisplay"></div>
    </div>
    <script>
        function updateProgress() {
            const checkboxes = document.querySelectorAll('[data-testid="selection-item"]');
            let checkedCount = 0;
            checkboxes.forEach(cb => {
                if (cb.checked) checkedCount++;
            });
            document.getElementById('resultDisplay').textContent = '已完成 ' + checkedCount + ' 项';
        }
    </script>
</body>
</html>
