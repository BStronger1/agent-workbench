<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文阅读任务记录</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px;
            max-width: 480px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            font-size: 14px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 32px;
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            background: #f9fafb;
        }
        input[type="text"]:focus {
            border-color: #6366f1;
            background: white;
        }
        button {
            padding: 14px 28px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        button:hover {
            background: #4f46e5;
        }
        button:active {
            transform: scale(0.97);
        }
        .result-section {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e5e7eb;
        }
        .result-label {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-label span {
            font-size: 16px;
        }
        .result-content {
            font-size: 18px;
            color: #111827;
            padding: 12px 16px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            min-height: 48px;
            word-break: break-word;
        }
        .result-content:empty::before {
            content: "暂无记录";
            color: #9ca3af;
        }
        .footer {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #9ca3af;
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }
        .footer span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 阅读任务</h1>
        <p class="subtitle">记录你的每日阅读计划</p>

        <div class="input-group">
            <input type="text" id="task-input" data-testid="task-input" placeholder="输入阅读任务内容..." autocomplete="off">
            <button id="primary-action" data-testid="primary-action">提交</button>
        </div>

        <div class="result-section">
            <div class="result-label">
                <span>📋</span> 项目进度
            </div>
            <div id="result" data-testid="result" class="result-content"></div>
        </div>

        <div class="footer">
            <span>📅 今日任务</span>
            <span>⏱ 实时更新</span>
        </div>
    </div>

    <script>
        (function() {
            const taskInput = document.getElementById('task-input');
            const submitBtn = document.getElementById('primary-action');
            const resultDisplay = document.getElementById('result');

            function handleSubmit() {
                const value = taskInput.value.trim();
                if (value === '') {
                    resultDisplay.textContent = '';
                    return;
                }
                resultDisplay.textContent = value;
            }

            submitBtn.addEventListener('click', handleSubmit);

            taskInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSubmit();
                }
            });
        })();
    </script>
</body>
</html>
