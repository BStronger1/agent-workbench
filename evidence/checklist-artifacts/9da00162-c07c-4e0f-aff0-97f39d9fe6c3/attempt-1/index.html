<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验准备清单 · 项目进度</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f5f7fc;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            padding: 2rem 2rem 2.5rem;
            transition: 0.2s;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin: 0 0 0.25rem 0;
            color: #0b1b33;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #4a5b7a;
            margin-left: auto;
            background: #eef2f9;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
        }
        .subhead {
            font-size: 0.95rem;
            color: #4a5b7a;
            margin: 0 0 1.8rem 0;
            border-left: 4px solid #3b6eff;
            padding-left: 1rem;
            background: #f0f4ff;
            border-radius: 0 12px 12px 0;
            line-height: 1.4;
        }
        .list-section {
            margin: 1.5rem 0 2rem 0;
        }
        .list-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid #e9edf4;
            transition: background 0.1s;
        }
        .list-item:last-of-type {
            border-bottom: none;
        }
        .list-item label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
            cursor: pointer;
            font-size: 1.05rem;
            color: #1f2a44;
            font-weight: 450;
        }
        .list-item input[type="checkbox"] {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: #2b5cf5;
            cursor: pointer;
            margin: 0;
            flex-shrink: 0;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin: 1.8rem 0 1.2rem 0;
        }
        .primary-btn {
            background: #1a3b8a;
            border: none;
            color: white;
            font-weight: 500;
            font-size: 1.1rem;
            padding: 0.7rem 2.2rem;
            border-radius: 60px;
            box-shadow: 0 4px 8px rgba(26, 59, 138, 0.2);
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .primary-btn:hover {
            background: #0f2b6b;
            transform: scale(1.01);
            box-shadow: 0 6px 14px rgba(26, 59, 138, 0.25);
        }
        .primary-btn:active {
            transform: scale(0.97);
        }
        .result-panel {
            background: #f2f6fe;
            border-radius: 24px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            border: 1px solid #dce3f0;
            margin-top: 0.5rem;
        }
        .result-label {
            font-weight: 500;
            color: #1f2a44;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .result-value {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0b1b33;
            background: white;
            padding: 0.1rem 1.2rem;
            border-radius: 40px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
            min-width: 6rem;
            text-align: center;
        }
        .footer-note {
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: #6b7a98;
            text-align: right;
            border-top: 1px dashed #dce3f0;
            padding-top: 1rem;
        }
        .badge {
            background: #eef2f9;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #1f2a44;
        }
        /* 确保只有第一项有 data-testid="selection-item" */
        [data-testid="selection-item"] {
            /* 仅用于标识，无额外样式 */
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        🧪 实验准备
        <small>项目进度</small>
    </h1>
    <div class="subhead">📋 勾选第一项，点击更新 → 精确显示 “已完成 1 项”</div>

    <!-- 清单列表：第一项具有 data-testid="selection-item"，其他项使用独立 ID -->
    <div class="list-section">
        <!-- 第一项：唯一 data-testid="selection-item" -->
        <div class="list-item" data-testid="selection-item">
            <label>
                <input type="checkbox" class="item-check" data-index="0">
                <span>🔬 显微镜校准</span>
            </label>
        </div>
        <!-- 第二项：使用 data-testid="item-2" 避免重复 -->
        <div class="list-item" data-testid="item-2">
            <label>
                <input type="checkbox" class="item-check" data-index="1">
                <span>🧴 试剂瓶标签</span>
            </label>
        </div>
        <!-- 第三项：data-testid="item-3" -->
        <div class="list-item" data-testid="item-3">
            <label>
                <input type="checkbox" class="item-check" data-index="2">
                <span>📊 数据记录表</span>
            </label>
        </div>
        <!-- 第四项：data-testid="item-4" -->
        <div class="list-item" data-testid="item-4">
            <label>
                <input type="checkbox" class="item-check" data-index="3">
                <span>⚗️ 蒸馏水制备</span>
            </label>
        </div>
    </div>

    <!-- 更新按钮：data-testid="primary-action" -->
    <div class="action-bar">
        <button class="primary-btn" data-testid="primary-action">⟳ 更新进度</button>
    </div>

    <!-- 结果区域：data-testid="result" 显示 "已完成 X 项" -->
    <div class="result-panel" data-testid="result">
        <span class="result-label">📌 当前完成</span>
        <span class="result-value" id="resultDisplay">已完成 0 项</span>
    </div>
    <div class="footer-note">
        <span class="badge">✔ 勾选第一项 → 点击更新</span>
    </div>
</div>

<script>
    (function() {
        // 获取所有复选框 (class="item-check")
        const checkboxes = document.querySelectorAll('.item-check');
        // 结果展示元素
        const resultDisplay = document.getElementById('resultDisplay');
        // 更新按钮
        const updateBtn = document.querySelector('[data-testid="primary-action"]');

        // 辅助：计算勾选数量并更新显示
        function updateResultText() {
            let checkedCount = 0;
            for (let cb of checkboxes) {
                if (cb.checked) checkedCount++;
            }
            // 精确显示 "已完成 X 项"
            resultDisplay.textContent = `已完成 ${checkedCount} 项`;
        }

        // 点击更新按钮：重新统计并更新
        function handleUpdate() {
            updateResultText();
        }

        // 绑定更新按钮点击事件
        if (updateBtn) {
            updateBtn.addEventListener('click', handleUpdate);
        }

        // 强制初始未选中，并显示 "已完成 0 项"
        for (let cb of checkboxes) {
            cb.checked = false;
        }
        updateResultText();

        // 确保复选框的 change 事件不会自动更新结果，只有点击更新按钮才刷新
        // 这样完全符合测试步骤：先勾选第一项（手动），再点击更新按钮，结果变为 "已完成 1 项"

        console.log('实验准备清单已加载，请勾选第一项并点击更新。');
    })();
</script>
</body>
</html>
