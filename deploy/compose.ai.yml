services:
  vector:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: workbench
      POSTGRES_DB: workbench
      POSTGRES_PASSWORD: ${VECTOR_PASSWORD:?Set VECTOR_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - workbench-vector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  workbench-vector: