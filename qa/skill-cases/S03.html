<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>交互验收</title></head><body><h1>预算累计</h1><input data-testid="amount" value="0"><button data-testid="primary-action">增加</button><output data-testid="result">10</output><script>
let total=10;document.querySelector('button').onclick=()=>{total+=document.querySelector('input').value;document.querySelector('output').textContent=total};
</script></body></html>
