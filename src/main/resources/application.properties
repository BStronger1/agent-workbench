server.port=${PORT:8123}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
spring.application.name=agent-workbench
spring.jackson.serialization.indent-output=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.tomcat.max-http-form-post-size=1MB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
workbench.data=${WORKBENCH_DATA:./data}
workbench.mode=${WORKBENCH_MODE:demo}
workbench.api-key=${LLM_API_KEY:}
workbench.base-url=${LLM_BASE_URL:https://api.deepseek.com/v1}
workbench.model=${LLM_MODEL:deepseek-chat}
workbench.live-access-token=${LIVE_ACCESS_TOKEN:}
workbench.qa-command=${QA_COMMAND:}
workbench.input-price=${INPUT_PRICE_PER_MILLION:0}
workbench.output-price=${OUTPUT_PRICE_PER_MILLION:0}
workbench.provider-hosts=${PROVIDER_ALLOWED_HOSTS:api.deepseek.com,api.openai.com,dashscope.aliyuncs.com,dashscope-intl.aliyuncs.com,api.siliconflow.cn,api.siliconflow.com,api.moonshot.cn,api.moonshot.ai,openrouter.ai,ark.cn-beijing.volces.com,api.minimaxi.com,www.dmxapi.cn}
